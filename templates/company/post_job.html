{% extends "base.html" %}
{% block title %}Post vacancy{% endblock %}
{% block content %}
<div class="container py-4">
  <div class="panel p-4" style="max-width:720px">
    <h1 class="h4">Post a job or internship</h1>
    <form method="post">
      <div class="mb-3">
        <label class="form-label">Title</label>
        <input class="form-control" name="title" required>
      </div>
      <div class="row">
        <div class="col-md-6 mb-3">
          <label class="form-label">Type</label>
          <select class="form-select" name="job_type">
            <option value="job">Job</option>
            <option value="internship">Internship</option>
          </select>
        </div>
        <div class="col-md-6 mb-3">
          <label class="form-label">Location</label>
          <input class="form-control" name="location" placeholder="Bengaluru / Remote">
        </div>
      </div>
      <div class="mb-3">
        <label class="form-label">Salary / stipend</label>
        <input class="form-control" name="salary">
      </div>
      <div class="mb-3">
        <label class="form-label">Required skills (comma separated)</label>
        <input class="form-control" name="required_skills" placeholder="Python, Flask, SQL">
      </div>
      <div class="mb-3">
        <label class="form-label">Description</label>
        <textarea class="form-control" name="description" rows="5"></textarea>
      </div>
      <button class="btn btn-navy" type="submit">Publish</button>
    </form>
  </div>
</div>
{% endblock %}
