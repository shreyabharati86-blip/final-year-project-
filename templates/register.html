{% extends "base.html" %}
{% block title %}Register{% endblock %}
{% block content %}
<div class="container">
  <div class="auth-wrap panel p-4 p-md-5">
    <h1 class="h3 mb-1">Create account</h1>
    <p class="text-muted mb-4">Join as a candidate or a company</p>
    <form method="post">
      <div class="mb-3">
        <label class="form-label">Full name</label>
        <input class="form-control" name="name" required>
      </div>
      <div class="mb-3">
        <label class="form-label">Email</label>
        <input class="form-control" type="email" name="email" required>
      </div>
      <div class="mb-3">
        <label class="form-label">Password</label>
        <input class="form-control" type="password" name="password" minlength="6" required>
      </div>
      <div class="mb-3">
        <label class="form-label">I am a</label>
        <select class="form-select" name="role" id="role">
          <option value="candidate">Candidate</option>
          <option value="company">Company</option>
        </select>
      </div>
      <div id="company-fields" class="d-none">
        <div class="mb-3">
          <label class="form-label">Company name</label>
          <input class="form-control" name="company_name">
        </div>
        <div class="mb-3">
          <label class="form-label">Industry</label>
          <input class="form-control" name="industry" placeholder="IT, Finance, ...">
        </div>
      </div>
      <button class="btn btn-navy w-100" type="submit">Register</button>
    </form>
    <p class="mt-3 mb-0">Already have an account? <a href="{{ url_for('login') }}">Login</a></p>
  </div>
</div>
{% endblock %}
