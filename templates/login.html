{% extends "base.html" %}
{% block title %}Login{% endblock %}
{% block content %}
<div class="mx-auto max-w-md px-4 py-10">
  <div class="rounded-2xl border border-slate-200 bg-white p-6 shadow-sm md:p-8">
    <h1 class="text-2xl font-bold text-navy">Login</h1>
    <p class="mb-6 mt-1 text-sm text-slate-500">Use your CareerConnect account</p>
    <form class="space-y-4" method="post">
      <div>
        <label class="mb-1 block text-sm font-medium">Email</label>
        <input class="w-full rounded-lg border border-slate-200 px-3 py-2.5 text-sm outline-none focus:border-brand focus:ring-2 focus:ring-blue-100" type="email" name="email" required>
      </div>
      <div>
        <label class="mb-1 block text-sm font-medium">Password</label>
        <input class="w-full rounded-lg border border-slate-200 px-3 py-2.5 text-sm outline-none focus:border-brand focus:ring-2 focus:ring-blue-100" type="password" name="password" required>
      </div>
      <button class="w-full rounded-lg bg-navy py-2.5 text-sm font-semibold text-white hover:bg-slate-800" type="submit">Login</button>
    </form>
    <p class="mt-5 text-xs leading-6 text-slate-500">
      Demo accounts:<br>
      Candidate <code class="rounded bg-slate-100 px-1">rahul@gmail.com</code> / <code class="rounded bg-slate-100 px-1">user123</code><br>
      Company <code class="rounded bg-slate-100 px-1">hr@technova.com</code> / <code class="rounded bg-slate-100 px-1">company123</code><br>
      Admin <code class="rounded bg-slate-100 px-1">admin@careerconnect.com</code> / <code class="rounded bg-slate-100 px-1">admin123</code>
    </p>
    <p class="mt-4 text-sm">New here? <a class="font-semibold text-brand hover:underline" href="{{ url_for('register') }}">Register</a></p>
  </div>
</div>
{% endblock %}
